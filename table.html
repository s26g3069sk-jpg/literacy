<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>演習の表</title>
    <style>
        /* 表に見栄えのいい枠線をつけるためのCSS（お好みで） */
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>講義スケジュール</h1>

    <table>
        <tr>
            <th>回</th>
            <th>日付</th>
            <th>講義内容</th>
        </tr>
        <tr>
            <td>1</td>
            <td>4/14</td>
            <td>教科書第0章</td>
        </tr>
        <tr>
            <td>2</td>
            <td>4/21</td>
            <td>教科書第1章</td>
        </tr>
    </table>

</body>
</html>
